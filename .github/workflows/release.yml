name: انتشار دارایی‌ها

# چرا این کار لازم است؟
# محیط توسعه به `uploads.github.com` دسترسی ندارد (`curl` → SSL_ERROR_SYSCALL)، و توکن موجود
# اجازهٔ `workflow_dispatch` هم نمی‌دهد؛ بنابراین آپلود دستی دارایی‌ها همیشه BLOCKED می‌ماند.
# رانر GitHub هر دو دسترسی را دارد، پس همین کار فایل‌های **ثبت‌شده در مخزن** را در Release
# می‌گذارد. هیچ چیزی دوباره ساخته نمی‌شود تا بایت‌ها و sha256 دقیقاً همان چیزی بماند که در
# `artifacts/checksums.json` و مستندات آمده است.
#
# اجرا: خودکار روی هر push به main (و اجرای دستی).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'برچسب انتشار'
        required: false
        default: 'v0.1.0'

permissions:
  contents: write

concurrency:
  group: release-assets
  cancel-in-progress: false

jobs:
  publish:
    name: آپلود دارایی‌های ثبت‌شده در Release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ inputs.tag || 'v0.1.0' }}
    steps:
      - uses: actions/checkout@v4

      - name: بررسی sha256 همهٔ دارایی‌ها پیش از آپلود
        run: |
          node -e '
          const { createHash } = require("crypto");
          const fs = require("fs");
          const all = JSON.parse(fs.readFileSync("artifacts/checksums.json", "utf8"));
          let bad = 0;
          for (const [key, meta] of Object.entries(all)) {
            const file = `artifacts/${meta.file}`;
            if (!fs.existsSync(file)) { console.log(`::error title=asset::${key}: فایل نیست`); bad++; continue; }
            const buf = fs.readFileSync(file);
            const sha = createHash("sha256").update(buf).digest("hex");
            const ok = sha === meta.sha256 && buf.length === meta.bytes;
            console.log(`::${ok ? "notice" : "error"} title=asset::${meta.file} ${buf.length}B sha256=${sha} ${ok ? "OK" : "MISMATCH"}`);
            if (!ok) bad++;
          }
          if (bad) process.exit(1);
          '

      - name: ساخت یا به‌روزرسانی انتشار
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --title "پایش ۲ — نسخه ${TAG#v}" \
              --notes-file docs/releases/v0.1.0.md --target "$GITHUB_SHA"
          fi
          gh release upload "$TAG" --clobber \
            artifacts/payesh2-win-x64.zip \
            artifacts/payesh2-standalone-html.zip \
            artifacts/payesh2-standalone.html \
            artifacts/payesh2-android.apk \
            artifacts/checksums.json \
            artifacts/payesh2-win-x64.json \
            artifacts/payesh2-linux-x64.json \
            artifacts/payesh2-win-static.json \
            artifacts/payesh2-android.json \
            artifacts/payesh2-android-verify.txt \
            artifacts/payesh2-android-badging.txt \
            artifacts/BUILD.md

      - name: گزارش دارایی‌های منتشرشده
        run: |
          gh release view "$TAG" --json assets \
            --jq '.assets[] | "\(.name) — \(.size) بایت — \(.url)"' | sed 's/^/::notice title=release asset::/'
          gh release view "$TAG" --json url --jq .url
